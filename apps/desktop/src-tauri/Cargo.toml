[package]
name = "auroch-syna-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "auroch_syna_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell   = "2"
tauri-plugin-fs      = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-process = "2"
tauri-plugin-http    = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"  # size — the daemon does the heavy lifting
strip   = true
